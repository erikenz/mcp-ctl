name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Nothing here writes to the repository. Actions are pinned to full commit SHAs
# (Dependabot updates the pins) so a moved tag cannot run code with this token.
permissions:
  contents: read

# A newer push supersedes an older pull-request run, so cancel it. A push to main
# always runs: that commit is the release base.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Build
        run: cargo build --all-features --locked

      # The end-to-end tests need the fake MCP server, hence --all-features.
      - name: Test
        run: cargo test --all-features --locked

  musl:
    name: Static build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Releases ship musl binaries so one file runs on any distribution, whatever
      # its glibc. Building one here means a link failure shows up on a pull request
      # instead of at tag time. The target supplies its own libc and links static; no
      # musl-gcc, which would produce a dynamically linked binary instead.
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check the binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/mcp-ctl
          file "$bin"
          # A dynamically linked binary carries an INTERP segment; a static one,
          # static-pie included, does not. `file` calls the latter "static-pie
          # linked", so grepping its output for "statically" is not reliable.
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::the musl build needs a dynamic loader"
            exit 1
          fi
          "$bin" --version

      # The release builds these too; building them here means a broken control
      # file or spec fails a pull request instead of a tag.
      - name: Build .deb and .rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          bash packaging/build-packages.sh 0.0.0 amd64 x86_64 \
            target/x86_64-unknown-linux-musl/release/mcp-ctl dist

      - name: Inspect the packages
        run: |
          dpkg-deb -I dist/mcp-ctl_0.0.0_amd64.deb
          dpkg-deb -c dist/mcp-ctl_0.0.0_amd64.deb | grep -q 'usr/bin/mcp-ctl'
          rpm -qip dist/mcp-ctl-0.0.0-1.x86_64.rpm
          rpm -qlp dist/mcp-ctl-0.0.0-1.x86_64.rpm | grep -qx '/usr/bin/mcp-ctl'

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust ${{ env.MSRV }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Check
        run: cargo check --all-features --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # A prebuilt binary: `cargo install cargo-audit` compiled it for two minutes
      # on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit

      # A tool that reads your vault should be able to say its dependency tree is
      # free of known advisories.
      - name: Audit
        run: cargo audit

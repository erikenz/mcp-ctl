# Analyses the workflows themselves: template injection, over-broad permissions,
# unpinned actions. Findings land in the repository's code scanning tab.
name: Actions security

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/
          min-confidence: high
          min-severity: high
          # Uploading a SARIF report needs code scanning, which a private repository
          # only has with GitHub Advanced Security. Without the report the audit still
          # runs and still fails the job on a finding.
          advanced-security: ${{ !github.event.repository.private }}
